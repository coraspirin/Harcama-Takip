services:
  harcama-takip:
    build: .
    image: harcama-takip:latest
    container_name: harcama-takip
    ports:
      # Sol taraf = sunucudaki dis port; .env icindeki HOST_PORT ile degistirilir.
      # Ayni sunucuda 4000'i kullanan baska bir servis varsa dosyayi duzenlemek
      # yerine HOST_PORT=4001 yazmak yeterli -- git pull ile catisma cikmaz.
      - '${HOST_PORT:-4000}:4000'
    volumes:
      # SQLite veritabani kalici olarak burada tutulur.
      - harcama-data:/data
    env_file:
      # Sirlar (.env) imaja gomulmez, calisma aninda okunur.
      # Ilk kurulumda: cp .env.example .env  ve degerleri doldurun.
      - .env
    environment:
      # DIKKAT: buradakiler env_file'i EZER (compose onceligi). Yol degiskenleri
      # bilerek burada sabitlenmistir: .env.example'daki degerler gelistirme
      # icindir (./data, ../client/dist) ve "cp .env.example .env" yapan biri
      # onlari container'a tasirsa frontend 404 doner, veritabani da kalici
      # volume yerine container katmanina yazilip her rebuild'de silinirdi.
      - NODE_ENV=production
      - PORT=4000
      - DATA_DIR=/data/db
      - CLIENT_DIR=/app/client/dist
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - TZ=Europe/Istanbul
    restart: unless-stopped
    logging:
      # Sinirsiz log dosyasi diski doldurur; gunluk tarama her gun yazar.
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  harcama-data:

networks:
  # Subnet BILEREK sabit. Home Assistant gibi host uzerinde (container disinda)
  # calisan servislere erisim, host guvenlik duvarinda bu araliga izin veren bir
  # kural gerektirir:
  #
  #   sudo ufw allow from 172.30.7.0/24 to any port 8123 proto tcp
  #
  # Docker subnet'i otomatik atasaydi, ag her yeniden olustugunda (docker compose
  # down/up) baska bir aralik secilebilir ve kural sessizce gecersizlesirdi --
  # entegrasyon aylar sonra, gorunurde sebepsiz calismayi birakirdi.
  #
  # Aralik sunucudaki baska bir Docker agiyla cakisirsa ("Pool overlaps") .env
  # icine DOCKER_SUBNET=172.31.7.0/24 gibi bos bir aralik yazin.
  default:
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.30.7.0/24}
